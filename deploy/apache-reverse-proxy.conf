# Apache reverse-proxy config for horizontally-scaled algo.websocket
# gateways — WS_ARCHITECTURE.md in this same directory explains the design.
#
# Enable required modules first (see run-time note at the bottom for how to
# check what's already enabled on this host):
#   a2enmod proxy proxy_http proxy_wstunnel proxy_balancer lbmethod_byrequests slotmem_shm
#   systemctl restart apache2
#
# No sticky sessions needed: every gateway instance in the balancer mirrors
# the SAME broker tick state (via CentralTickClient — see WS_GATEWAY_ONLY in
# ws_main.py), so a browser's WebSocket can land on any instance and stays
# on that one connection for its lifetime (inherent to WS, not something
# this config has to arrange). Plain round-robin is correct here.

<Proxy "balancer://ws-gateway-cluster">
    # One BalancerMember per running gateway instance — add a line here each
    # time deploy/start_gateway.sh (or the algo-websocket-gateway@N systemd
    # template) brings up a new one. 8003 is the primary (owns the broker
    # connection) — it's a perfectly normal gateway target too, no need to
    # exclude it from the pool.
    BalancerMember "ws://127.0.0.1:8003"
    BalancerMember "ws://127.0.0.1:8013"
    BalancerMember "ws://127.0.0.1:8023"
</Proxy>

<VirtualHost *:443>
    ServerName websocket.finedgealgo.com
    # SSL directives (cert/key paths) — copy from this host's existing vhost
    # for this domain, unchanged. Not duplicated here since they're
    # environment-specific and already correctly configured today.

    ProxyPreserveHost On

    # WebSocket traffic — load-balanced across the gateway pool.
    ProxyPass /ws/ balancer://ws-gateway-cluster/ws/
    ProxyPassReverse /ws/ balancer://ws-gateway-cluster/ws/

    # Everything else (REST: /fno-stocks, /algo/*/historical-data, /health,
    # /ticker/*) is stateless and fine on a single instance — no need to
    # balance these, and /ticker/* (subscribe/unsubscribe/prewarm-config)
    # specifically must only ever reach the primary (8003), since that's the
    # only instance holding the real broker connection.
    ProxyPass / http://127.0.0.1:8003/
    ProxyPassReverse / http://127.0.0.1:8003/
</VirtualHost>

# ── Verifying what's already enabled on this host ──────────────────────────
# apache2ctl -M | grep -E 'proxy|lbmethod|slotmem'
